<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 240px;
        margin: 0;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111;
        color: #f2f2f2;
      }
      p {
        margin: 0 0 12px;
        font-size: 13px;
        line-height: 1.4;
      }
      button {
        width: 100%;
        padding: 10px 0;
        border: none;
        border-radius: 8px;
        background: #fff;
        color: #111;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <p>Every tab in this window is pinned. Sort the pinned tabs instead?</p>
    <button id="confirm">Sort pinned tabs</button>
    <script src="confirm.js"></script>
  </body>
</html>
