<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chromatic, compare sorts</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f2;
        --ink: #151513;
        --muted: #5f5d57;
        --strip: #e4e2dc;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1b1b19;
          --ink: #f1efe9;
          --muted: #a9a69e;
          --strip: #2c2c29;
        }
      }
      body {
        margin: 0;
        padding: 32px;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      p {
        color: var(--muted);
        margin: 0 0 24px;
        max-width: 70ch;
      }
      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 28px 0 8px;
      }
      .strip {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 10px;
        background: var(--strip);
        border-radius: 10px;
      }
      .tab {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: var(--bg);
        position: relative;
      }
      .tab img {
        width: 20px;
        height: 20px;
      }
      .tab.break {
        margin-left: 10px;
      }
      .tab.break::before {
        content: "";
        position: absolute;
        left: -8px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        border-radius: 1px;
        background: var(--muted);
        opacity: 0.4;
      }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid var(--muted);
        background: transparent;
        color: var(--ink);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Compare sorts</h1>
    <p>
      Your current window's unpinned tabs, as they are now, sorted the old way (1.0) and sorted the new
      way. Hover an icon to see the site and how it was read. Gaps in the new strip mark where one
      section or color block ends and the next begins. Nothing here moves your tabs.
    </p>
    <button id="refresh">Refresh</button>
    <div id="out"></div>
    <script type="module" src="compare.js"></script>
  </body>
</html>
