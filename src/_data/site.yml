# Homepage introduction
headline: I like starting new things with good people, and making them last.
intro: I started at NBC as an intern and ended up on the skunkworks project that became Hulu. Since then I’ve launched things at AOL, co-founded a studio called Wildebeest, and helped reshape thoughtbot. Closer to home, I’ve run drive-in movie nights and turned my driveway into a produce pickup.
now: Right now I’m Managing Director and a board member at thoughtbot, where I build a small AI tool for my team most weeks to find out what better really looks like. I’m also President of Ruby Central. I live in Los Angeles.

# Closing invitation on the homepage
invitation: Got an idea, or a problem that won’t budge?
invitation_note: Usually the first step is working out what the problem really is, and the smallest useful thing that would help. Send me a few sentences and we’ll start there.

