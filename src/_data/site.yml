# Site-wide settings and homepage text.
# Edit this in Pages CMS under "Site and homepage", or right here on GitHub.

name: Ran Craycraft
title: Ran Craycraft
description: Ran Craycraft builds businesses, launches products and leads organizations through change. Managing Director at thoughtbot and President of Ruby Central.
location: Los Angeles
# The footer line after "© year". location stays in the search-engine data.
footer_note: Ran Craycraft. California.
email: ran.craycraft@gmail.com
# Not shown on the page. Search engines and AI tools read it as a one-line description of you.
tagline: Founder and executive who builds businesses, launches products, and leads organizations through what’s next
job_title: Managing Director
employer: thoughtbot
employer_url: https://thoughtbot.com

# Homepage introduction
headline: I build businesses, launch products, and lead organizations through what’s next.
intro: I’m a founder and executive who brings together product vision, commercial strategy, and operational leadership. I’ve led a $40 million business at AOL, built an award-winning consultancy, transformed operations at thoughtbot, and helped return Ruby Central to financial stability.
now: I do my best work where there’s something ambitious to build, a business to transform, or a difficult problem worth solving.

# Names that become links in the homepage intro, each to its Leading piece. Edit the words freely, the links follow the names.
org_links:
  AOL: /leading/launching-new-ventures-at-aol/
  award-winning consultancy: /leading/wildebeest/
  thoughtbot: /leading/building-the-next-chapter-of-thoughtbot/
  Ruby Central: /leading/helping-stabilize-ruby-central/

# Kinds of leadership, shown as labels on Leading cards and as filters on the Leading page.
# Set `led` in a piece's front matter to one of these keys.
leading_groups:
  - key: inside
    label: Inside companies
  - key: founded
    label: Founded
  - key: community
    label: In the community

# Topics for the filters on Writing and Making. Set `topics` in a post's front matter (or in elsewhere.yml) to one or more of these keys.
writing_topics:
  - key: ai
    label: AI
  - key: product
    label: Building products
  - key: consulting
    label: Consulting
  - key: ruby
    label: Ruby
making_topics:
  - key: team
    label: For my team
  - key: public
    label: Public tools
  - key: fun
    label: For fun
  - key: home
    label: At home

# Closing invitation on the homepage
invitation: Let’s discuss what's next.
invitation_note: A leadership opportunity, a new venture, or a product worth building. Tell me what you’re working toward, and I'll do my best to help.

# Profiles that are you. Search engines and AI tools use these to connect the dots.
same_as:
  - label: LinkedIn
    url: https://www.linkedin.com/in/craycraft/
  - label: GitHub
    url: https://github.com/rantbot
  - label: thoughtbot
    url: https://thoughtbot.com/blog/authors/ran-craycraft

# More links in the footer, after the profiles above. These aren't profiles of you, so search engines don't treat them as you.
footer_links:
  - label: Ruby Central
    url: https://rubycentral.org

